name: Relatar um problema
description: Algo não funciona como deveria
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar. Quanto mais detalhes, mais rápido conseguimos corrigir.
        **Falha de segurança?** Não use este formulário: siga o [SECURITY.md](https://github.com/esquerdaindica-gif/esquerda-indica/blob/main/SECURITY.md).
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Conte o que você viu.
      placeholder: Ao salvar o perfil com a cidade de Juiz de Fora, apareceu "Algo deu errado".
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      description: Os passos para ver o problema acontecer de novo.
      placeholder: |
        1. Entrar com uma conta comum
        2. Abrir Minha conta, Editar perfil
        3. Trocar a cidade e salvar
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde aconteceu
      options:
        - Celular (app instalado)
        - Celular (navegador)
        - Computador
    validations:
      required: true
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e navegador
      placeholder: Android 15, Chrome
  - type: textarea
    id: imagens
    attributes:
      label: Capturas de tela
      description: Se puder, anexe imagens. Esconda telefones, e-mails e outros dados pessoais.
